# ==============================================================================
# kyar-kyar — Personal Blog & Digital Garden Configuration
# Fully vibe coded website generator configured entirely via this YAML file
# ==============================================================================

# Personal Identity & Branding (Your Name, Face Photo & Tagline)
author: "Kyar-Kyar"
tagline: "Software Engineer, Writer & Thinker"
bio: "Technical documentation, operational guides, and architecture for kyar-kyar."
avatarUrl: ""
title: "Kyar-Kyar's Notes"
baseUrl: "https://kyar-kyar.github.io"

# Aesthetics & Theme Calibration
theme:
  # Master palette or default dark mode palette
  palette: "classic-dark"

  # Light Mode Color Scheme:
  # Clean traditional light paper theme
  # Options: "classic-light", "kanagawa-lotus", "rose-pine-dawn", "gruvbox-light", "catppuccin-latte", "everforest-light", "nord-snow", "solarized-light", "tokyo-night-day"
  lightPalette: "classic-light"

  # Dark Mode Color Scheme:
  # Clean traditional charcoal stone dark theme
  # Options: "classic-dark", "everforest", "nord", "tokyo-night", "rose-pine", "kanagawa", "catppuccin", "solarized-dark", "gruvbox-dark", "monokai-pro"
  darkPalette: "classic-dark"

  # Default initial color mode on visit: "dark", "light", or "system"
  colorMode: "light"

  # Sidebar Placement:
  # Options:
  #   - "left"  : Docked to the left side
  #   - "right" : Docked to the right side
  #   - "popup" : Clean distraction-free view with toggleable slide-over drawer
  sidebarPlacement: "left"

  # Background Texture Pattern:
  # Options: "none", "dots", "grid", "lines", "crosshatch", "blueprint", "noise"
  backgroundPattern: "none"

  # Typography: "sans" (modern clean), "serif" (literary book), "mono" (technical)
  fontFamily: "sans"

  # Accent Highlight Color (Optional hex color, comment out to use palette accent)
  # accentColor: "#af3a03"

  # Granular Hex Overrides (Optional — you can override any specific color directly in YAML):
  # customColors:
  #   lightBg: "#fbfbfa"
  #   lightSidebar: "#f7f7f6"
  #   lightCard: "#ffffff"
  #   lightBorder: "#e5e5e4"
  #   lightText: "#1c1917"
  #   darkBg: "#002b36"
  #   darkSidebar: "#073642"
  #   darkCard: "#00212b"
  #   darkBorder: "#0e4e5e"
  #   darkText: "#93a1a1"

# Navigation & Reading Features
navigation:
  showFolderCounts: true
  showTableOfContents: true
  showBacklinks: true
  showReadingTime: true
  showWordCount: true
  defaultExpandedFolders: true

# Social Links
social:
  github: "https://github.com/rishav-dhungel"
  twitter: "https://x.com"
  linkedin: "https://linkedin.com"
  email: "rishavdhungel3@gmail.com"
  rss: true

# Site Footer
footer:
  text: "powered by kyar-kyar fully vibe coded website generator"
